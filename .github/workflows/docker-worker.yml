# Purpose: Build and publish reviewed worker images for changed runtime sources.
# Input/Output: Reads source files and writes immutable multi-architecture images to GHCR.
# Invariants: Documentation-only and Compose-pin commits do not create a new image digest.
# Debugging: Inspect the Build and push worker image step plus its published digest.

name: Docker Worker Publish

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "src/**"
      - "requirements.txt"
      - "docker/Dockerfile"
      - "docker/entrypoint.sh"
      - "custom_components/paperless_kiplus/manifest.json"
      - ".github/workflows/docker-worker.yml"

permissions:
  contents: read
  packages: write

jobs:
  docker-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read application version
        id: app
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open("custom_components/paperless_kiplus/manifest.json", encoding="utf-8"))["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/paperless-kiplus-worker
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_VERSION=${{ steps.app.outputs.version }}
